# fly.io deployment manifest for the reachability probe.
#
# Deploy:
#   cd probe
#   fly launch --no-deploy   # answers: name = oblivion-probe, region = nearest, no PG/Redis
#   fly deploy
#
# Then point cs2servergui at the resulting host:
#   "reachability_probe_url": "https://oblivion-probe.fly.dev/check"

app = "oblivion-probe"
primary_region = "jnb"   # Johannesburg — adjust to wherever most of your operators are

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # free tier-friendly; cold-start is ~1s
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
