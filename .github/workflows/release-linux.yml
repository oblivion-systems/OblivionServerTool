name: Release Linux artifacts

# Build the AppImage + .deb on every version tag and attach them to the
# GitHub release for that tag. Mirrors docker-publish.yml's trigger so all
# three Linux distribution shapes (Docker image, AppImage, .deb) ship together.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    # 22.04 for broad glibc compatibility — the onefile's build-host glibc is
    # its minimum runtime glibc. Matches the Dockerfile base + CI test matrix.
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # needed to upload assets to the release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build AppImage + .deb
        run: |
          chmod +x packaging/linux/build.sh
          packaging/linux/build.sh all

      - name: List artifacts
        run: ls -la dist/*.AppImage dist/*.deb

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: true
