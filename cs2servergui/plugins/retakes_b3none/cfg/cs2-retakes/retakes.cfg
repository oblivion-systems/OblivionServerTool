// Oblivion Server Tool — B3none retakes config.
// RetakesPlugin only creates its own retakes.cfg if this file is ABSENT, so
// shipping ours stops it re-adding bot_kick / bot_quota 0. This mirrors
// B3none's defaults except the bot lines: empty retake slots are auto-filled
// with bots so rounds form even on a low-population server (real players take
// over slots as they join). B3none spawns the bots at the proper retake spawns.

// ── Bots: auto-fill (Oblivion override of B3none's bot_kick / bot_quota 0) ──
bot_quota_mode          fill
bot_quota               9
bot_difficulty          1

// ── Things you shouldn't change (B3none defaults) ──
mp_autoteambalance      0
mp_forcecamera          1
mp_give_player_c4       0
mp_halftime             0
mp_ignore_round_win_conditions 0
mp_join_grace_time      0
mp_match_can_clinch     0
mp_maxmoney             0
mp_playercashawards     0
mp_respawn_on_death_ct  0
mp_respawn_on_death_t   0
mp_solid_teammates      1
mp_teamcashawards       0
mp_warmup_pausetimer    0
sv_skirmish_id          0

// ── Things you can change (B3none defaults) ──
mp_roundtime_defuse     0.25
mp_autokick             0
mp_c4timer              40
mp_freezetime           1
mp_friendlyfire         0
mp_round_restart_delay  2
sv_talk_enemy_dead      0
sv_talk_enemy_living    0
sv_deadtalk             1
spec_replay_enable      0
mp_maxrounds            30
mp_match_end_restart    0
mp_timelimit            0
mp_match_restart_delay  10
mp_death_drop_gun       1
mp_death_drop_defuser   1
mp_death_drop_grenade   1
mp_warmuptime           15

echo [Retakes] Oblivion config loaded (bots: auto-fill)
