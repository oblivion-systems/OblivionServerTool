# CS2MenuManager configuration — themed for the Oblivion Server Tool.
# Forces the center-screen HTML menu (auto-paginated, resolution-independent,
# the most readable type) and colours it to match the app: Purple accents,
# White options on the dark game backdrop.  Colours use CS2MenuManager's named
# palette (not hex), so Purple/White/Grey is as close to the app theme as the
# in-game menu allows.

[DefaultMenuType]
# Options: ConsoleMenu, ChatMenu, WasdMenu, CenterHtmlMenu
# ChatMenu was tried but it prints every menu line (incl. long !skills/!shop
# descriptions) as chat messages; rapid menu opens flooded the client's network
# recv queue (100-message overflow) and timed players out.  WasdMenu renders
# on-screen on its own channel — no flood, no flicker.  Trade-off: WasdMenu is
# resolution-positioned, so 4:3 / non-16:9 players can see horizontal cutoff
# (true fix = the CS2MenuManager_MenuManager companion plugin + a database for
# per-player resolution).
DefaultMenuType = "WasdMenu"

[ForceConfigSettings]
# true → this file wins even when a plugin (WarcraftPlugin) tries to set its own
# menu type/colours, so the theme + CenterHtmlMenu choice always applies.
ForceConfigSettings = true

