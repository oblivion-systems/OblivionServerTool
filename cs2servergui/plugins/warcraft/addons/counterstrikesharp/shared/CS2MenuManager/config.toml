# Every entry uses the 4:3-safe X offset (-6.8) on purpose.  Without per-player
# resolution selection (which needs MySQL), the server can't know a client's
# resolution, so we anchor the menu where it fits the NARROWEST aspect (4:3 /
# 4:3-stretched): that position also fits fine on 16:9 (just a touch more toward
# centre) instead of running off-screen.  The reverse — a 16:9 offset on 4:3 —
# is what caused the cutoff.  PositionY nudged up (1.0) to recover the bottom of
# tall pages — WasdMenu shows 5 items/page (hardcoded) and items with descriptions
# overflow when vertically centred, clipping the last item's description.
[Resolutions.1920x1080]
PositionX = -6.8
PositionY = 1.0

[Resolutions.1680x1050]
PositionX = -6.8
PositionY = 1.0

[Resolutions.1600x900]
PositionX = -6.8
PositionY = 1.0

[Resolutions.1440x1080]
PositionX = -6.8
PositionY = 1.0

[Resolutions.1280x1080]
PositionX = -6.8
PositionY = 1.0

[Resolutions.1280x720]
PositionX = -6.8
PositionY = 1.0

[Resolutions.1280x1024]
PositionX = -6.8
PositionY = 1.0

[Resolutions.1024x768]
PositionX = -6.8
PositionY = 1.0

[Resolutions.800x600]
PositionX = -6.8
PositionY = 1.0

